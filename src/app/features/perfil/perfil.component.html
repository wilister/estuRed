<div class="perfil">
  <h1>Mi Perfil</h1>

  <div *ngIf="cargando"><div class="spinner"></div></div>

  <div class="perfil-card" *ngIf="!cargando && perfil">

    <div *ngIf="!editando">
      <div class="avatar">{{ perfil!.alias.charAt(0).toUpperCase() }}</div>
      <h2>{{ perfil!.alias }}</h2>

      <div class="info-grid">
        <div class="info-item">
          <span class="label">Nivel Educativo</span>
          <span class="valor">{{ perfil!.nivel }}</span>
        </div>
        <div class="info-item">
          <span class="label">Centro Educativo</span>
          <span class="valor">{{ perfil!.centro }}</span>
        </div>
        <div class="info-item">
          <span class="label">Miembro desde</span>
          <span class="valor">{{ perfil!.created_at | date:'dd/MM/yyyy' }}</span>
        </div>
      </div>

      <button class="btn-editar" (click)="activarEdicion()">✏️ Editar Perfil</button>
    </div>

    <div *ngIf="editando" class="form-edicion">
      <h2>Editar Perfil</h2>

      <div class="form-group">
        <label>Alias</label>
        <input type="text" [(ngModel)]="aliasEdit" placeholder="Tu alias" />
      </div>

      <div class="form-group">
        <label>Nivel Educativo</label>
        <select [(ngModel)]="nivelEdit">
          <option *ngFor="let n of niveles" [value]="n">{{ n }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Centro Educativo</label>
        <input type="text" [(ngModel)]="centroEdit" placeholder="Tu centro" />
      </div>

      <div class="botones">
        <button class="btn-cancelar" (click)="cancelarEdicion()">Cancelar</button>
        <button class="btn-guardar" (click)="guardarCambios()" [disabled]="guardando">
          {{ guardando ? 'Guardando...' : 'Guardar Cambios' }}
        </button>
      </div>
    </div>

    <div class="mensaje" *ngIf="mensaje">{{ mensaje }}</div>
  </div>
</div>
