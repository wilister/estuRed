<div class="dashboard">
  <h1>📊 Dashboard</h1>

  <div *ngIf="cargando"><div class="spinner"></div></div>

  <div *ngIf="!cargando">
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-icon">📋</span>
        <span class="stat-numero">{{ totalSolicitudes }}</span>
        <span class="stat-label">Solicitudes totales</span>
      </div>
      <div class="stat-card">
        <span class="stat-icon">💬</span>
        <span class="stat-numero">{{ totalRespuestas }}</span>
        <span class="stat-label">Respuestas dadas</span>
      </div>
      <div class="stat-card">
        <span class="stat-icon">👥</span>
        <span class="stat-numero">{{ totalUsuarios }}</span>
        <span class="stat-label">Usuarios registrados</span>
      </div>
    </div>

    <div class="graficas-grid">
      <div class="grafica-card">
        <h2>Solicitudes por nivel</h2>
        <canvas #chartNiveles></canvas>
      </div>

      <div class="grafica-card">
        <h2>Asignaturas más consultadas</h2>
        <canvas #chartAsignaturas></canvas>
      </div>

      <div class="grafica-card full-width">
        <h2>Actividad últimos 7 días</h2>
        <canvas #chartDias></canvas>
      </div>
    </div>
  </div>
</div>
