<div class="auth-container">
  <div class="auth-card">
    <h1>🎓 EstuRed</h1>
    <h2>Crear Cuenta</h2>

    <div class="form-group">
      <label>Alias (apodo anónimo)</label>
      <input type="text" [(ngModel)]="alias" placeholder="Ej: EstudianteCurioso42" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="tu@email.com" />
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password" placeholder="Mínimo 6 caracteres" />
    </div>

    <div class="form-group">
      <label>Nivel Educativo</label>
      <select [(ngModel)]="nivel">
        <option value="">Selecciona tu nivel</option>
        <option *ngFor="let n of niveles" [value]="n">{{ n }}</option>
      </select>
    </div>

    <div class="form-group">
      <label>Centro Educativo</label>
      <input type="text" [(ngModel)]="centro" placeholder="Ej: IES Ramón y Cajal" />
    </div>

    <div class="error" *ngIf="error">{{ error }}</div>

    <button class="btn-primary" (click)="registrar()" [disabled]="cargando">
      {{ cargando ? 'Creando cuenta...' : 'Registrarse' }}
    </button>

    <p class="link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
